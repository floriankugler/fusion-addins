# The workshop the examples are nested for (python -m lang.nest examples/van.py):
# the machine's bed, the saw, and the stock on hand. Sizes in mm, a piece of
# stock's along its grain first; areas in m2. See lang/nest/workshop.py.

bed = [2000, 1000]      # the CNC's bed; a blank goes on it either way round
spacing = 10            # between two parts
margin = 10             # from a part to its blank's edge
kerf = 4                # the saw's cut
max_cuts = 5            # saw cuts per sheet at most
keep_across = 300       # a rest is kept as stock from 300 mm across
keep_area = 0.25        # and 0.25 m2; smaller ones are waste
seconds = 20            # the nest's time per material

[[sheet]]               # every material, as many as needed
size = [2470, 1240]

[[offcut]]
material = "birch 15"
size = [1250, 600]
